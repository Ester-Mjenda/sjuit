<!DOCTYPE html>
<html>
  <head>
    <title>Multi-Step Form</title>
    <style>
      .step {
        display: none;
      }
      .step.active {
        display: block;
      }
    </style>
  </head>
  <body>
    <form id="multiStepForm">
      <div class="step active" id="step1">
        <h2>Step 1: Form Four Details</h2>
        <label for="formFourDetails">Form Four Details:</label>
        <input
          type="text"
          id="formFourDetails"
          name="formFourDetails"
        /><br /><br />
        <button type="button" onclick="nextStep(1)">Next</button>
      </div>
      <div class="step" id="step2">
        <h2>Step 2: Program Choices</h2>
        <label for="programChoices">Program Choices:</label>
        <input
          type="text"
          id="programChoices"
          name="programChoices"
        /><br /><br />
        <button type="button" onclick="prevStep(2)">Previous</button>
        <button type="button" onclick="nextStep(2)">Next</button>
      </div>
      <div class="step" id="step3">
        <h2>Step 3: Additional Information</h2>
        <label for="additionalInfo">Additional Information:</label>
        <input
          type="text"
          id="additionalInfo"
          name="additionalInfo"
        /><br /><br />
        <button type="button" onclick="prevStep(3)">Previous</button>
        <button type="button" onclick="nextStep(3)">Next</button>
      </div>
      <div class="step" id="step4">
        <h2>Step 4: Review and Submit</h2>
        <p id="reviewFormFourDetails"></p>
        <p id="reviewProgramChoices"></p>
        <p id="reviewAdditionalInfo"></p>
        <button type="button" onclick="prevStep(4)">Previous</button>
        <button type="button" onclick="submitForm()">Submit</button>
      </div>
    </form>

    <script>
      function nextStep(currentStep) {
        saveData(currentStep);
        document
          .getElementById("step" + currentStep)
          .classList.remove("active");
        document
          .getElementById("step" + (currentStep + 1))
          .classList.add("active");
        if (currentStep === 3) {
          reviewData();
        }
      }

      function prevStep(currentStep) {
        document
          .getElementById("step" + currentStep)
          .classList.remove("active");
        document
          .getElementById("step" + (currentStep - 1))
          .classList.add("active");
      }

      function saveData(step) {
        const formFourDetails =
          document.getElementById("formFourDetails").value;
        const programChoices = document.getElementById("programChoices").value;
        const additionalInfo = document.getElementById("additionalInfo").value;

        localStorage.setItem("formFourDetails", formFourDetails);
        localStorage.setItem("programChoices", programChoices);
        localStorage.setItem("additionalInfo", additionalInfo);
      }

      function reviewData() {
        document.getElementById("reviewFormFourDetails").innerText =
          "Form Four Details: " + localStorage.getItem("formFourDetails");
        document.getElementById("reviewProgramChoices").innerText =
          "Program Choices: " + localStorage.getItem("programChoices");
        document.getElementById("reviewAdditionalInfo").innerText =
          "Additional Information: " + localStorage.getItem("additionalInfo");
      }

      function submitForm() {
        alert("Form submitted successfully!");
        // Add your form submission code here
      }
    </script>
  </body>
</html>
