    <!-- javasript -->
    <script>
      function generateIndexFields() {
        const numberOfSeats = document.getElementById("f4s").value;
        const indexFieldsContainer = document.getElementById("indexFields");
        indexFieldsContainer.innerHTML = ""; // Clear existing fields

        for (let i = 1; i <= numberOfSeats; i++) {
          const label = document.createElement("label");
          label.setAttribute("for", "indexNo" + i);
          label.innerText = `Enter form four index number ${i}:`;

          const input = document.createElement("input");
          input.type = "text";
          input.id = "indexNo" + i;
          input.name = "indexNo" + i;
          input.required = true;
          input.placeholder = `SXXXX/YYYY/${new Date().getFullYear()}`;

          indexFieldsContainer.appendChild(label);
          indexFieldsContainer.appendChild(document.createElement("br"));
          indexFieldsContainer.appendChild(input);
          indexFieldsContainer.appendChild(document.createElement("br"));
        }
      }
    </script>
